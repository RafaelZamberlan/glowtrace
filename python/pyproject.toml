[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "glowtrace"
version = "0.3.0"
description = "See your API as an n8n-style flow and watch every request run through it (FastAPI first)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Glowtrace contributors" }]
keywords = ["fastapi", "tracing", "observability", "visualization", "control-flow", "debugging"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Debuggers",
  "Topic :: System :: Monitoring",
]
dependencies = ["starlette>=0.27"]

[project.optional-dependencies]
dev = ["fastapi>=0.100", "httpx>=0.24", "pytest>=7", "pytest-asyncio>=0.21", "uvicorn>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/glowtrace"]
# the built UI is git-ignored (generated by `npm run build` in ui/) but must ship in the wheel
artifacts = ["src/glowtrace/_ui/**"]


[tool.pytest.ini_options]
testpaths = ["tests"]
